spring.application.name=calendar-app
server.port=8082

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/doodle}
spring.datasource.username=${DB_USERNAME:doodle}
spring.datasource.password=${DB_PASSWORD:doodle}
spring.datasource.hikari.read-only=true
spring.mvc.problemdetails.enabled=true

# max window of GET /calendar/users/{userId}
calendar.max-window=P31D
