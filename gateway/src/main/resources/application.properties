spring.application.name=gateway
server.port=8080
spring.mvc.problemdetails.enabled=true

# Routes; controllers already carry the /booking and /calendar prefixes, so paths are forwarded as is
spring.cloud.gateway.server.webmvc.routes[0].id=booking
spring.cloud.gateway.server.webmvc.routes[0].uri=${BOOKING_URL:http://localhost:8081}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/booking/**

spring.cloud.gateway.server.webmvc.routes[1].id=calendar
spring.cloud.gateway.server.webmvc.routes[1].uri=${CALENDAR_URL:http://localhost:8082}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/calendar/**

# HTTP client to the backends; no retries (POST commands are not idempotent)
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=10s
