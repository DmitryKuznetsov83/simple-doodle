services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: doodle
      POSTGRES_USER: doodle
      POSTGRES_PASSWORD: doodle
    ports:
      - "5432:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doodle -d doodle"]
      interval: 5s
      timeout: 3s
      retries: 10

  booking-app:
    build:
      context: .
      dockerfile: booking-app/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/doodle
      DB_USERNAME: doodle
      DB_PASSWORD: doodle
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  calendar-app:
    build:
      context: .
      dockerfile: calendar-app/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/doodle
      DB_USERNAME: doodle
      DB_PASSWORD: doodle
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
